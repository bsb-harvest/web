services:
  # Database: PostgreSQL 16 with PostGIS extension
  db:
    image: postgis/postgis:16-3.4
    container_name: agritech_postgis
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agritech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agritech_secret}
      POSTGRES_DB: ${POSTGRES_DB:-agritech_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agritech} -d ${POSTGRES_DB:-agritech_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # In-memory Cache & Task Queue
  redis:
    image: redis:7-alpine
    container_name: agritech_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Backend: Python FastAPI Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agritech_backend
    restart: always
    environment:
      - APP_ENV=development
      - DEBUG=True
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-agritech}:${POSTGRES_PASSWORD:-agritech_secret}@db:5432/${POSTGRES_DB:-agritech_db}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  # Frontend: Next.js Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agritech_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
